# Cloudflare Worker — SENTINEL weather service (Phase 6).
#
# Separate from the Pages project on purpose: this worker holds a
# service-role secret, which must never be part of the browser bundle.
#
# Deploy:  npx wrangler deploy --config worker/wrangler.toml
# Secrets: npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config worker/wrangler.toml

name = "sentinel-weather"
main = "index.ts"
compatibility_date = "2026-10-21"

# The school coordinates the advisory is computed for. Override per deployment
# with `wrangler secret put` / dashboard variables.
[vars]
SCHOOL_ID = "11111111-1111-1111-1111-111111111111"
# PLACEHOLDER coordinates — replace with the school's real coordinates before a
# pilot. Until then the advisory is labelled as a placeholder in the UI.
LATITUDE = "0"
LONGITUDE = "0"
LOCATION_LABEL = "placeholder coordinates (0.0000, 0.0000) — not the school's real location"
ALLOWED_ORIGIN = "https://sentinel-app-1jo.pages.dev"

# SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are secrets, not vars:
#   npx wrangler secret put SUPABASE_URL --config worker/wrangler.toml
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --config worker/wrangler.toml
